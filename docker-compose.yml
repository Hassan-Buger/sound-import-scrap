services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soundimports
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper_pass
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d soundimports"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://scraper:scraper_pass@db:5432/soundimports"
      LOG_LEVEL: "INFO"
    depends_on:
      db:
        condition: service_healthy
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  scraper:
    build: .
    environment:
      DATABASE_URL: "postgresql+asyncpg://scraper:scraper_pass@db:5432/soundimports"
      LOG_LEVEL: "INFO"
    depends_on:
      db:
        condition: service_healthy
    command: ["scrape", "--full"]
    profiles:
      - scraper

volumes:
  pgdata:
